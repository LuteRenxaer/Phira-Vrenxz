<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DG-LAB Live 玩家监控</title>
    <script src="qrcode.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: #fff;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        /* 顶部栏 */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            margin-bottom: 30px;
        }
        
        .title {
            font-size: 24px;
            font-weight: bold;
            background: linear-gradient(90deg, #00d4ff, #7b2cbf);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        /* 连接按钮区域 */
        .connect-section {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .socket-status {
            font-size: 14px;
            padding: 6px 12px;
            border-radius: 20px;
            background: rgba(255,71,87,0.2);
            color: #ff4757;
            border: 1px solid rgba(255,71,87,0.3);
        }
        
        .socket-status.connected {
            background: rgba(46,213,115,0.2);
            color: #2ed573;
            border-color: rgba(46,213,115,0.3);
        }
        
        .connect-btn {
            padding: 10px 24px;
            background: linear-gradient(135deg, #00d4ff, #7b2cbf);
            border: none;
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .connect-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0,212,255,0.3);
        }
        
        /* 二维码弹窗 */
        #qrcode-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10000;
            visibility: hidden;
        }
        
        #qrcode-container {
            background: white;
            padding: 25px;
            border-radius: 16px;
            text-align: center;
            max-width: 350px;
            width: 90%;
            position: relative;
        }
        
        #qrcode-text {
            margin-bottom: 15px;
        }
        
        #qrcode-text p {
            color: #333;
            font-size: 14px;
            font-weight: bold;
            margin: 0;
        }
        
        #qrcode {
            width: 200px;
            height: 200px;
            margin: 0 auto 15px;
            padding: 10px;
            background: white;
            border: 1px solid #ddd;
            border-radius: 8px;
        }
        
        .close-qrcode {
            padding: 10px 25px;
            background: linear-gradient(135deg, #00d4ff, #7b2cbf);
            border: none;
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 5px;
        }
        
        .close-qrcode:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0,212,255,0.3);
        }
        
        /* 搜索区域 */
        .search-section {
            background: rgba(255,255,255,0.05);
            border-radius: 16px;
            padding: 40px;
            text-align: center;
            margin-bottom: 20px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        
        .search-title {
            font-size: 20px;
            margin-bottom: 20px;
            color: rgba(255,255,255,0.9);
        }
        
        .search-box {
            display: flex;
            gap: 10px;
            max-width: 500px;
            margin: 0 auto;
        }
        
        .search-input {
            flex: 1;
            padding: 15px 20px;
            border: 2px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            background: rgba(0,0,0,0.2);
            color: #fff;
            font-size: 16px;
            outline: none;
            transition: all 0.3s;
        }
        
        .search-input:focus {
            border-color: #00d4ff;
            box-shadow: 0 0 20px rgba(0,212,255,0.2);
        }
        
        .search-input::placeholder {
            color: rgba(255,255,255,0.4);
        }
        
        .search-btn {
            padding: 15px 30px;
            background: linear-gradient(135deg, #00d4ff, #7b2cbf);
            border: none;
            border-radius: 12px;
            color: #fff;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .search-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(0,212,255,0.3);
        }
        
        .search-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        
        /* 设置面板 */
        .settings-section {
            background: rgba(255,255,255,0.05);
            border-radius: 16px;
            padding: 25px;
            margin-bottom: 20px;
            border: 1px solid rgba(255,255,255,0.1);
            display: none;
        }
        
        .settings-section.active {
            display: block;
        }
        
        .settings-title {
            font-size: 18px;
            margin-bottom: 20px;
            color: rgba(255,255,255,0.9);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .settings-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }
        
        .setting-item {
            background: rgba(0,0,0,0.2);
            padding: 15px;
            border-radius: 12px;
        }
        
        .setting-label {
            font-size: 14px;
            color: rgba(255,255,255,0.7);
            margin-bottom: 10px;
            display: block;
        }
        
        .channel-checkboxes {
            display: flex;
            gap: 20px;
        }
        
        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            font-size: 14px;
        }
        
        .checkbox-label input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }
        
        .setting-input {
            width: 100%;
            padding: 10px 15px;
            border: 2px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            background: rgba(0,0,0,0.2);
            color: #fff;
            font-size: 14px;
            outline: none;
        }
        
        .setting-input:focus {
            border-color: #00d4ff;
        }
        
        .setting-hint {
            font-size: 12px;
            color: rgba(255,255,255,0.5);
            margin-top: 5px;
        }
        
        /* 玩家数据卡片区域 */
        .player-data-section {
            display: none;
        }
        
        .player-data-section.active {
            display: block;
        }
        
        .section-title {
            font-size: 18px;
            margin-bottom: 20px;
            color: rgba(255,255,255,0.8);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .online-indicator {
            width: 10px;
            height: 10px;
            background: #2ed573;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        /* 玩家卡片 */
        .player-cards {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }
        
        .player-card {
            background: rgba(255,255,255,0.05);
            border-radius: 16px;
            padding: 20px;
            border: 1px solid rgba(255,255,255,0.1);
            transition: all 0.3s;
        }
        
        .player-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            border-color: rgba(0,212,255,0.3);
        }
        
        /* 玩家卡片抖动和闪红动画 */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
            20%, 40%, 60%, 80% { transform: translateX(5px); }
        }
        
        @keyframes flashRed {
            0%, 100% { border-color: rgba(255,255,255,0.1); box-shadow: none; }
            50% { border-color: rgba(244,67,54,0.8); box-shadow: 0 0 20px rgba(244,67,54,0.5); }
        }
        
        .player-card.shake-flash {
            animation: shake 0.5s ease-in-out, flashRed 0.5s ease-in-out;
        }
        
        .player-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        
        .player-name {
            font-size: 18px;
            font-weight: bold;
            color: #fff;
        }
        
        .player-status {
            font-size: 12px;
            padding: 4px 10px;
            border-radius: 20px;
            background: rgba(46,213,115,0.2);
            color: #2ed573;
        }
        
        .player-status.playing {
            background: rgba(0,212,255,0.2);
            color: #00d4ff;
        }
        
        .player-stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }
        
        .stat-item {
            background: rgba(0,0,0,0.2);
            padding: 12px;
            border-radius: 10px;
            text-align: center;
        }
        
        .stat-label {
            font-size: 11px;
            color: rgba(255,255,255,0.5);
            margin-bottom: 5px;
            text-transform: uppercase;
        }
        
        .stat-value {
            font-size: 20px;
            font-weight: bold;
        }
        
        .stat-value.perfect { color: #4CAF50; }
        .stat-value.good { color: #8BC34A; }
        .stat-value.bad { color: #FF9800; }
        .stat-value.miss { color: #f44336; }
        .stat-value.accuracy { color: #00d4ff; }
        .stat-value.combo { color: #e91e63; }
        .stat-value.score { color: #ffd700; }
        
        /* 判定统计网格 */
        .judgement-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid rgba(255,255,255,0.1);
        }
        
        .judgement-item {
            text-align: center;
            padding: 8px;
            background: rgba(0,0,0,0.2);
            border-radius: 8px;
        }
        
        .judgement-label {
            font-size: 10px;
            color: rgba(255,255,255,0.5);
            margin-bottom: 3px;
        }
        
        .judgement-value {
            font-size: 16px;
            font-weight: bold;
        }
        
        /* 提示信息 */
        .hint-box {
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            color: rgba(255,255,255,0.5);
            border: 1px dashed rgba(255,255,255,0.2);
        }
        
        .hint-box.error {
            background: rgba(244,67,54,0.1);
            border-color: rgba(244,67,54,0.3);
            color: #f44336;
        }
        
        /* 响应式 */
        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                gap: 20px;
            }
            
            .connect-section {
                width: 100%;
                justify-content: center;
            }
            
            .search-box {
                flex-direction: column;
            }
            
            .player-cards {
                grid-template-columns: 1fr;
            }
            
            .settings-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <!-- 二维码弹窗 -->
    <div id="qrcode-overlay">
        <div id="qrcode-container">
            <div id="qrcode-text">
                <p>使用DG-LAB APP扫码建立WebSocket链接</p>
            </div>
            <div id="qrcode"></div>
            <button class="close-qrcode" onclick="hideqrcode()">关闭</button>
        </div>
    </div>

    <div class="container">
        <!-- 顶部栏 -->
        <div class="header">
            <div class="title">DG-LAB Live 玩家监控</div>
            <div class="connect-section">
                <div class="socket-status" id="socketStatus">未连接</div>
                <button class="connect-btn" id="connectBtn" onclick="showqrcode()">连接</button>
            </div>
        </div>
        
        <!-- 搜索区域 -->
        <div class="search-section">
            <div class="search-title">输入玩家名称查询实时游玩数据</div>
            <div class="search-box">
                <input type="text" class="search-input" id="playerNameInput" placeholder="请输入玩家名称...">
                <button class="search-btn" id="searchBtn" onclick="searchPlayer()">查询</button>
            </div>
        </div>
        
        <!-- 设置面板 -->
        <div class="settings-section" id="settingsSection">
            <div class="settings-title">
                <span>DG-LAB 输出设置</span>
            </div>
            <div class="settings-grid">
                <div class="setting-item">
                    <label class="setting-label">输出通道</label>
                    <div class="channel-checkboxes">
                        <label class="checkbox-label">
                            <input type="checkbox" id="channelA" checked>
                            <span>A通道</span>
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" id="channelB" checked>
                            <span>B通道</span>
                        </label>
                    </div>
                </div>
                <div class="setting-item">
                    <label class="setting-label">最高强度 (0-200)</label>
                    <input type="number" class="setting-input" id="maxStrength" value="100" min="0" max="200">
                    <div class="setting-hint">软件上限200，建议根据承受能力设置</div>
                </div>
                <div class="setting-item">
                    <label class="setting-label">每Bad增加强度</label>
                    <input type="number" class="setting-input" id="badIncrement" value="5" min="0" max="200">
                    <div class="setting-hint">触发Bad时增加的强度值</div>
                </div>
                <div class="setting-item">
                    <label class="setting-label">每Miss增加强度</label>
                    <input type="number" class="setting-input" id="missIncrement" value="10" min="0" max="200">
                    <div class="setting-hint">触发Miss时增加的强度值</div>
                </div>
            </div>
        </div>
        
        <!-- 提示区域 -->
        <div class="hint-box" id="hintBox">
            请输入玩家名称并点击查询按钮
        </div>
        
        <!-- 玩家数据区域 -->
        <div class="player-data-section" id="playerDataSection">
            <div class="section-title">
                <div class="online-indicator"></div>
                <span id="sectionTitle">玩家游玩数据</span>
            </div>
            <div class="player-cards" id="playerCards">
                <!-- 玩家卡片将动态插入这里 -->
            </div>
        </div>
    </div>

    <script src="wsConnection.js"></script>
    <script>
        // Socket连接状态
        let socketConnected = false;
        let currentPlayerName = '';
        let playerDataEventSource = null; // SSE连接
        
        // 玩家数据缓存（用于检测变化）
        let playerStatsCache = {};
        
        // 当前强度值
        let currentStrengthA = 0;
        let currentStrengthB = 0;
        
        // 初始化二维码 - 参考dglab/index.html的方式
        var qrcodeOverlay = document.getElementById("qrcode-overlay");
        var qrcodeImg = new QRCode(
            document.getElementById("qrcode"),
            "https://www.dungeon-lab.com/app-download.php#DGLAB-SOCKET#ws://dgsocket.tianstudio.top/"
        );
        
        // 显示二维码
        function showqrcode() {
            qrcodeOverlay.style.visibility = "visible";
            // 尝试连接WebSocket
            if (typeof connectWs === 'function' && !socketConnected) {
                connectWs();
            }
        }
        
        // 隐藏二维码
        function hideqrcode() {
            qrcodeOverlay.style.visibility = "hidden";
        }
        
        // 更新Socket连接状态
        function updateSocketStatus(connected) {
            socketConnected = connected;
            const statusEl = document.getElementById('socketStatus');
            const btnEl = document.getElementById('connectBtn');
            
            if (connected) {
                statusEl.textContent = '已连接';
                statusEl.className = 'socket-status connected';
                btnEl.textContent = '断开';
                btnEl.onclick = disconnectWs;
            } else {
                statusEl.textContent = '未连接';
                statusEl.className = 'socket-status';
                btnEl.textContent = '连接';
                btnEl.onclick = showqrcode;
            }
        }
        
        // 断开连接
        function disconnectWs() {
            if (typeof closeWs === 'function') {
                closeWs();
            }
            updateSocketStatus(false);
        }
        
        // 搜索玩家
        async function searchPlayer() {
            const input = document.getElementById('playerNameInput');
            const btn = document.getElementById('searchBtn');
            const hintBox = document.getElementById('hintBox');
            const playerDataSection = document.getElementById('playerDataSection');
            const settingsSection = document.getElementById('settingsSection');
            
            const playerName = input.value.trim();
            if (!playerName) {
                showHint('请输入玩家名称', 'error');
                return;
            }
            
            currentPlayerName = playerName;
            btn.disabled = true;
            btn.textContent = '查询中...';
            
            try {
                // 查询玩家是否在线 (API端口是31207)
                const response = await fetch(`http://${window.location.hostname}:31207/api/player/status?name=${encodeURIComponent(playerName)}`);
                const data = await response.json();
                
                if (data.online) {
                    // 玩家在线，显示数据区域和设置面板
                    hintBox.style.display = 'none';
                    playerDataSection.classList.add('active');
                    settingsSection.classList.add('active');
                    document.getElementById('sectionTitle').textContent = `${playerName} 的实时游玩数据`;
                    
                    // 开始SSE玩家数据流
                    startPlayerDataStream(playerName);
                } else {
                    showHint(`玩家 "${playerName}" 当前不在线`, 'error');
                    playerDataSection.classList.remove('active');
                    settingsSection.classList.remove('active');
                }
            } catch (error) {
                console.error('查询失败:', error);
                showHint('查询失败，请稍后重试', 'error');
            } finally {
                btn.disabled = false;
                btn.textContent = '查询';
            }
        }
        
        // 显示提示
        function showHint(message, type = '') {
            const hintBox = document.getElementById('hintBox');
            hintBox.textContent = message;
            hintBox.className = 'hint-box ' + type;
            hintBox.style.display = 'block';
        }
        
        // 获取设置值
        function getSettings() {
            return {
                channelA: document.getElementById('channelA').checked,
                channelB: document.getElementById('channelB').checked,
                maxStrength: parseInt(document.getElementById('maxStrength').value) || 100,
                badIncrement: parseInt(document.getElementById('badIncrement').value) || 5,
                missIncrement: parseInt(document.getElementById('missIncrement').value) || 10
            };
        }
        
        // 发送波形并增加强度
        function sendWaveWithStrength(waveType, increment, settings) {
            if (!socketConnected) return;
            
            // 计算新强度
            if (settings.channelA) {
                currentStrengthA = Math.min(currentStrengthA + increment, settings.maxStrength);
                // 发送强度设置
                sendWsMsg({ type: 3, channel: 1, strength: currentStrengthA, message: "set channel" });
                // 发送波形（只播放一次，time=1）
                if (waveData[waveType]) {
                    sendWsMsg({ type: "clientMsg", message: `A:${waveData[waveType]}`, time: 1, channel: "A" });
                }
                // 波形播放完后将强度改为0（延迟1秒后）
                setTimeout(() => {
                    currentStrengthA = 0;
                    sendWsMsg({ type: 3, channel: 1, strength: 0, message: "set channel" });
                }, 1000);
            }
            
            if (settings.channelB) {
                currentStrengthB = Math.min(currentStrengthB + increment, settings.maxStrength);
                // 发送强度设置
                sendWsMsg({ type: 3, channel: 2, strength: currentStrengthB, message: "set channel" });
                // 发送波形（只播放一次，time=1）
                if (waveData[waveType]) {
                    sendWsMsg({ type: "clientMsg", message: `B:${waveData[waveType]}`, time: 1, channel: "B" });
                }
                // 波形播放完后将强度改为0（延迟1秒后）
                setTimeout(() => {
                    currentStrengthB = 0;
                    sendWsMsg({ type: 3, channel: 2, strength: 0, message: "set channel" });
                }, 1000);
            }
        }
        
        // 触发玩家卡片动画
        function triggerCardAnimation(playerId) {
            const card = document.getElementById(`player-card-${playerId}`);
            if (card) {
                card.classList.remove('shake-flash');
                void card.offsetWidth; // 强制重绘
                card.classList.add('shake-flash');
                
                // 动画结束后移除类
                setTimeout(() => {
                    card.classList.remove('shake-flash');
                }, 500);
            }
        }
        
        // 检测Bad/Miss变化并处理
        function checkStatsChange(playerId, newStats, settings) {
            const cacheKey = playerId;
            const oldStats = playerStatsCache[cacheKey] || { bad: 0, miss: 0 };
            
            const badDiff = (newStats.bad || 0) - (oldStats.bad || 0);
            const missDiff = (newStats.miss || 0) - (oldStats.miss || 0);
            
            let triggered = false;
            
            // 检测Bad增加
            if (badDiff > 0) {
                console.log(`玩家 ${playerId} Bad增加: ${badDiff}`);
                sendWaveWithStrength('Bad', badDiff * settings.badIncrement, settings);
                triggered = true;
            }
            
            // 检测Miss增加
            if (missDiff > 0) {
                console.log(`玩家 ${playerId} Miss增加: ${missDiff}`);
                sendWaveWithStrength('Miss', missDiff * settings.missIncrement, settings);
                triggered = true;
            }
            
            // 更新缓存
            playerStatsCache[cacheKey] = {
                bad: newStats.bad || 0,
                miss: newStats.miss || 0
            };
            
            return triggered;
        }
        
        // 开始SSE玩家数据流
        function startPlayerDataStream(playerName) {
            // 关闭之前的SSE连接
            stopPlayerDataStream();
            
            // 重置缓存
            playerStatsCache = {};
            
            // 创建SSE连接
            const sseUrl = `http://${window.location.hostname}:31207/api/player/stream?name=${encodeURIComponent(playerName)}`;
            playerDataEventSource = new EventSource(sseUrl);
            
            playerDataEventSource.onmessage = function(event) {
                try {
                    const data = JSON.parse(event.data);
                    if (data.online && data.players) {
                        const settings = getSettings();
                        
                        // 先检测哪些玩家需要触发动画
                        const triggeredPlayers = [];
                        data.players.forEach(player => {
                            const triggered = checkStatsChange(player.id, player.stats || {}, settings);
                            if (triggered) {
                                triggeredPlayers.push(player.id);
                            }
                        });
                        
                        // 渲染卡片
                        renderPlayerCards(data.players);
                        
                        // 渲染完成后再触发动画
                        triggeredPlayers.forEach(playerId => {
                            setTimeout(() => {
                                triggerCardAnimation(playerId);
                            }, 50);
                        });
                    } else {
                        // 玩家离线，关闭SSE
                        stopPlayerDataStream();
                        showHint(`玩家 "${playerName}" 已离线`, 'error');
                        document.getElementById('playerDataSection').classList.remove('active');
                        document.getElementById('settingsSection').classList.remove('active');
                    }
                } catch (e) {
                    console.error('解析玩家数据失败:', e);
                }
            };
            
            playerDataEventSource.onerror = function(error) {
                console.error('玩家数据SSE连接错误:', error);
                showHint('数据连接已断开', 'error');
            };
            
            playerDataEventSource.onopen = function() {
                console.log('已连接到玩家数据流');
            };
        }
        
        // 停止SSE玩家数据流
        function stopPlayerDataStream() {
            if (playerDataEventSource) {
                playerDataEventSource.close();
                playerDataEventSource = null;
            }
        }
        
        // 渲染玩家卡片
        function renderPlayerCards(players) {
            const container = document.getElementById('playerCards');
            container.innerHTML = '';
            
            players.forEach(player => {
                const card = createPlayerCard(player);
                container.appendChild(card);
            });
        }
        
        // 创建玩家卡片
        function createPlayerCard(player) {
            const card = document.createElement('div');
            card.className = 'player-card';
            card.id = `player-card-${player.id}`;
            
            const stats = player.stats || {};
            const accuracy = stats.accuracy ? stats.accuracy.toFixed(2) : '0.00';
            const statusClass = player.state === 'playing' ? 'playing' : '';
            const statusText = player.state === 'playing' ? '游戏中' : '在线';
            
            card.innerHTML = `
                <div class="player-header">
                    <div class="player-name">${player.name}</div>
                    <div class="player-status ${statusClass}">${statusText}</div>
                </div>
                <div class="player-stats">
                    <div class="stat-item">
                        <div class="stat-label">准确率</div>
                        <div class="stat-value accuracy">${accuracy}%</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-label">分数</div>
                        <div class="stat-value score">${stats.score || 0}</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-label">Max Combo</div>
                        <div class="stat-value combo">${stats.max_combo || 0}</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-label">当前 Combo</div>
                        <div class="stat-value combo">${stats.current_combo || 0}</div>
                    </div>
                </div>
                <div class="judgement-grid">
                    <div class="judgement-item">
                        <div class="judgement-label">Perfect</div>
                        <div class="judgement-value" style="color: #4CAF50;">${stats.perfect || 0}</div>
                    </div>
                    <div class="judgement-item">
                        <div class="judgement-label">Good</div>
                        <div class="judgement-value" style="color: #8BC34A;">${stats.good || 0}</div>
                    </div>
                    <div class="judgement-item">
                        <div class="judgement-label">Bad</div>
                        <div class="judgement-value" style="color: #FF9800;">${stats.bad || 0}</div>
                    </div>
                    <div class="judgement-item">
                        <div class="judgement-label">Miss</div>
                        <div class="judgement-value" style="color: #f44336;">${stats.miss || 0}</div>
                    </div>
                </div>
            `;
            
            return card;
        }
        
        // 监听Socket连接状态变化
        window.addEventListener('dglab-connected', () => {
            updateSocketStatus(true);
        });
        
        window.addEventListener('dglab-disconnected', () => {
            updateSocketStatus(false);
        });
        
        // 回车键搜索
        document.getElementById('playerNameInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                searchPlayer();
            }
        });
        
        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', function() {
            // 二维码已初始化
        });
        
        // 页面卸载时关闭SSE
        window.addEventListener('beforeunload', function() {
            stopPlayerDataStream();
        });
    </script>
</body>
</html>
