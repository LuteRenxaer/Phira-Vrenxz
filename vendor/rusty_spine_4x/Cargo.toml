[package]
edition = "2021"
name = "rusty_spine"
version = "0.8.0"
exclude = ["assets/*"]
description = "Spine runtime for Rust (and wasm!) transpiled from the official C Runtime."
homepage = "https://github.com/jabuwu/rusty_spine"
readme = "readme.md"
license-file = "LICENSE"
repository = "https://github.com/jabuwu/rusty_spine"

[profile.dev.package."*"]
opt-level = 3

[dependencies.libc]
version = "0.2"
optional = true

[dependencies.mint]
version = "0.5"
