name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'Phira-Vrenxz/**'
      - 'Phira-Vrenxz-main/**'
      - 'prpr/**'
      - 'assets/**'
      - 'phira.xcodeproj/**'
      - 'xcode/**'
      - 'phira.app/**'
      - '.github/workflows/ios.yml'

jobs:
  ios:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios
      - uses: Swatinem/rust-cache@v2
      - name: Build unsigned archive
        run: |
          set -euo pipefail
          xcodebuild -project phira.xcodeproj -scheme phira -configuration Release -sdk iphoneos -archivePath "$PWD/build/Phira.xcarchive" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Package IPA
        run: |
          set -euo pipefail
          rm -rf build/Payload build/Phira.ipa
          mkdir -p build/Payload
          cp -R "build/Phira.xcarchive/Products/Applications/Phira.app" build/Payload/
          cd build
          zip -qry Phira.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Phira-Vrenxz-ipa
          path: build/Phira.ipa
