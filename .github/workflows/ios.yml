name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'Phira-Vrenxz/**'
      - 'Phira-Vrenxz-main/**'
      - 'prpr/**'
      - 'vendor/**'
      - 'assets/**'
      - 'phira.xcodeproj/**'
      - 'xcode/**'
      - 'phira.app/**'
      - '.github/workflows/ios.yml'

permissions:
  contents: read
  issues: write

jobs:
  ipa:
    name: Unsigned IPA
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
      - name: Setup Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add aarch64-apple-ios
      - name: Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/xcode
          key: ios-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: ios-${{ runner.os }}-
      - name: Point cargo at Xcode iOS linker
        run: echo "CARGO_TARGET_AARCH64_APPLE_IOS_LINKER=$(xcrun --sdk iphoneos --find clang)" >> "$GITHUB_ENV"
      - name: Build unsigned
        run: |
          set -o pipefail
          xcodebuild \
            -project phira.xcodeproj \
            -scheme phira \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log
      - name: Show failure tail
        if: failure()
        run: |
          tail -n 300 build.log > /tmp/ios_fail.txt
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/ios_fail.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          BODY=$(jq -Rs '{title:"iOS build failure log", body:("```\n" + . + "\n```")}' /tmp/ios_fail.txt)
          curl -sS -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/issues \
            -d "$BODY"
      - name: Package IPA
        run: |
          set -euo pipefail
          APP="$(find build/dd/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -n1)"
          test -n "$APP" || { echo "no .app produced"; exit 1; }
          test -f "$APP/phira-main" || { echo "$APP/phira-main missing"; exit 1; }
          rm -rf out
          mkdir -p out/Payload
          cp -R "$APP" out/Payload/
          (cd out && zip -qry PhiraVrenxz-ios-arm64-unsigned.ipa Payload)
          ls -lh out/PhiraVrenxz-ios-arm64-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: PhiraVrenxz-unsigned-ipa
          path: out/PhiraVrenxz-ios-arm64-unsigned.ipa
          if-no-files-found: error
